# TD 3.2 Workspaces profile: uses the current Snowflake session.
# This credential-free profile is only for dbt Projects on Snowflake.
sideflix:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "not needed"
      user: "not needed"
      role: SYSADMIN
      warehouse: SIDEFLIX_WH
      database: SIDEFLIX
      schema: SILVER
      threads: 4
