version: 2
models:
- name: silver_catalog
  description: Cleaned and typed catalogue; one row per content item.
  columns:
  - name: content_id
    description: Stable content identifier (A through F in the demonstration).
    data_tests:
    - unique
    - not_null
  - name: duration_seconds
    description: Content duration in seconds.
  - name: imdb_tconst
    data_tests:
    - unique
    - not_null
  - name: content_type
    data_tests:
    - accepted_values:
        arguments:
          values:
          - film
          - short_film
          - documentary
          - reportage
          - series_episode
- name: stg_sessions
  description: 32 typed JSON rows with provenance and load timestamp.
  columns:
  - name: started_at_utc
    description: Session start converted to UTC.
- name: quarantine_sessions
  description: Invalid rows retained with the first rejection reason; S31 is expected.
- name: silver_sessions
  description: Valid sessions joined to the catalogue and deduplicated by session_id; 30 expected.
  columns:
  - name: session_id
    description: Final playback-summary identifier; a viewer can have multiple sessions.
    data_tests:
    - unique
    - not_null
  - name: watched_seconds
    description: Positive watched seconds, no greater than the content duration.
  - name: device
    data_tests:
    - accepted_values:
        arguments:
          values:
          - web
          - mobile
          - tv
  - name: content_id
    data_tests:
    - relationships:
        arguments:
          to: ref('silver_catalog')
          field: content_id
- name: silver_imdb
  description: "Selected IMDb identities, release years, genres and runtimes; one row per IMDb title."
  columns:
  - name: imdb_tconst
    data_tests:
    - unique
    - not_null
- name: silver_movielens
  description: "MovieLens rating count, mean and observation period; one row per IMDb title."
  columns:
  - name: imdb_tconst
    data_tests:
    - unique
    - not_null
- name: silver_wikidata
  description: "Verified Wikidata-to-IMDb mapping and English Wikipedia article; one row per content item."
  columns:
  - name: content_id
    data_tests:
    - unique
    - not_null
- name: silver_netflix
  description: "Dated Netflix Top 10 observations with explicit confirmed or unmatched catalogue mappings."
- name: silver_wikimedia
  description: "Daily English Wikipedia page views; one row per article and UTC observation day."
